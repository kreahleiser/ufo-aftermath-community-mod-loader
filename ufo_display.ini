; UFO Aftermath display helper 1.0.3
; Put opengl32.dll and this ini next to UFO.exe.

[Display]
; 169 = 16:9 3D + HUD stretched to 16:9, pillarboxed on ultrawide (default)
; 43  = largest 4:3 that fits (HUD unstretched, still much bigger than 1024x768)
Mode=169

; 1 = borderless fullscreen on the current monitor
; 0 = do not resize the window
Borderless=1

; Cap FPS. Aftermath UI/geoscape break if the GPU runs uncapped (common on AMD).
; 60 is what the engine was built for. 0 = unlimited.
FrameLimit=60

; 1 = nearest-neighbour UI textures (kills bitmap-font cell borders when scaled)
; 0 = leave the game's linear filtering
CrispUi=1

; 1 = write ufo_display.log next to the DLL (for bug reports)
Logging=0
